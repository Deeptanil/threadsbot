<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads Bot Command Center</title>
    <!-- Use standard Inter font for modern UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons (No emojis) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <header class="topbar">
        <div class="logo">
            <i class="ph ph-robot"></i>
            <h1>Bot Command Center</h1>
        </div>
        <div class="actions">
            <button onclick="openSettings()" class="btn-secondary" title="Settings">
                <i class="ph ph-gear"></i> Settings
            </button>
            <button onclick="fetchStatus(true)" class="btn-secondary" title="Refresh Data">
                <i class="ph ph-arrows-clockwise" id="refresh-icon"></i> Refresh
            </button>
        </div>
    </header>

    <main class="dashboard" id="dashboard-grid">
        <!-- Cards will be dynamically injected here via JS -->
    </main>

    <div class="analytics-section" style="padding: 20px 40px 20px; max-width: 800px; margin: 0 auto; margin-top: 20px; border-top: 1px solid var(--border-color);">
        <h2 style="font-size: 16px; margin-bottom: 16px; text-align: center;">Performance Overview</h2>
        <div style="height: 250px;">
            <canvas id="performanceChart"></canvas>
        </div>
    </div>

    <!-- Modal for Editing Roles/Posts -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Edit Configuration</h2>
                <button onclick="closeModal('edit-modal')" class="close-btn"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                <textarea id="modal-editor"></textarea>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal('edit-modal')" class="btn-secondary">Cancel</button>
                <button onclick="saveModalData()" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Modal for Settings -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Enterprise Settings</h2>
                <button onclick="closeModal('settings-modal')" class="close-btn"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h3><i class="ph ph-prohibit"></i> Global Blocklist</h3>
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Enter usernames to ignore (comma separated, no @)</p>
                    <textarea id="settings-blocklist" style="height: 60px; font-family: monospace;"></textarea>
                </div>
                
                <div id="account-settings-container">
                    <!-- Dynamic account settings injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal('settings-modal')" class="btn-secondary">Cancel</button>
                <button onclick="saveSettings()" class="btn-primary">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
