name: Auto Threads Bot - Account 3

on:
  schedule:
    # Runs at exact offset minutes (02, 17, 32, 47) to guarantee GitHub doesn't drop the job and to prevent git push collisions
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  post_to_threads:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write # Needed to commit the state files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Threads Bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.ACCOUNT3_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.ACCOUNT3_USER_ID }}
          THREADS_APP_ID: ${{ secrets.ACCOUNT3_APP_ID }}
          THREADS_API_SECRET: ${{ secrets.ACCOUNT3_API_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py account3 --role-txt-path roles/account3.txt

      - name: Commit and Push State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f posts-account3.json data-account3.json || true
          git commit -m "chore: update bot state [skip ci]" || echo "No changes to commit"
          git push
